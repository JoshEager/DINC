name: ${PROJECT_NAME}

services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    volumes:
      - ./openwebui:/app/backend/data
    # Open WebUI only reads most of these the very first time it starts. After
    # that it keeps its settings in its database (openwebui/webui.db), where your
    # changes in the admin panel live. So editing this block does nothing to an
    # existing install: DINC.py changes those settings with migrations instead.
    environment:
      # Every service runs in the timezone from .env, which DINC.py sets to
      # your machine's. TZ is read on every start, unlike the settings below.
      TZ: ${TZ:-UTC}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      OPENAI_API_BASE_URL: "https://openrouter.ai/api/v1"
      OPENAI_API_KEY: ${OPENROUTER_API_KEY}
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: "searxng"
      SEARXNG_QUERY_URL: "http://searxng:8080/search?q=<query>"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_IMAGE_GENERATION: "true"
      IMAGE_GENERATION_MODEL: ${IMAGE_GEN_MODEL}
      IMAGES_OPENAI_API_BASE_URL: "https://openrouter.ai/api/v1"
      IMAGES_OPENAI_API_KEY: ${OPENROUTER_API_KEY}
      TERMINAL_SERVER_CONNECTIONS: '[{"id": "open-terminal", "name": "Open Terminal", "url": "http://open-terminal:8000", "key": "${OPEN_TERMINAL_API_KEY}", "auth_type": "bearer", "config": {"access_grants": []}}]'
    network_mode: service:tailscale
    depends_on:
      - tailscale
      - open-terminal

  # Tailscale is used for networking (highly recommend learning it--it's an awesome tool)
  tailscale:
    image: tailscale/tailscale:latest
    hostname: dinc
    environment:
      TZ: ${TZ:-UTC}
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: "/var/lib/tailscale"
      TS_SERVE_CONFIG: "/config/serve.json"
    volumes:
      - ./tailscale/state:/var/lib/tailscale
      - ./tailscale/config:/config
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    restart: unless-stopped
    networks: 
      - ai-stack

  # Searxng is used for web search. It is a search engine. 
  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      SEARXNG_HOST: "[::]"
      SEARXNG_PORT: 8080
    volumes:
      - ./searxng/config:/etc/searxng/:rw
      - ./searxng/data:/var/cache/searxng/
    networks:
      - ai-stack

  # Open Terminal is the model's sandboxed Linux machine. It can install packages,
  # create and edit files, run code, and browse the web from inside the container.
  # Open WebUI connects to it through the dedicated terminal integration, which also
  # adds a file browser and an interactive terminal pane to the UI.
  # It is also where agents like Claude Code, Codex, OpenCode or Hermes live: install
  # one in here and Open WebUI offers it in the model picker (see the README).
  open-terminal:
    image: ghcr.io/open-webui/open-terminal:latest
    restart: unless-stopped
    volumes:
      - ./open-terminal:/home/user
    environment:
      TZ: ${TZ:-UTC}
      OPEN_TERMINAL_API_KEY: ${OPEN_TERMINAL_API_KEY}
      # Extra ACP agents beyond the built-in ones, as JSON. Manage them with
      # "ACP agents" in DINC.py, which stores them as ACP_AGENTS in .env.
      OPEN_TERMINAL_ACP_AGENTS: ${ACP_AGENTS:-}
    networks:
      - ai-stack

networks:
  ai-stack:
