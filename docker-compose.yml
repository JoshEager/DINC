name: ${PROJECT_NAME}

services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:main-slim
    restart: unless-stopped
    volumes:
      - ./openwebui:/app/backend/data
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      OPENAI_API_BASE_URL: "https://openrouter.ai/api/v1"
      OPENAI_API_KEY: ${OPENROUTER_API_KEY}
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: "searxng"
      SEARXNG_QUERY_URL: "http://searxng:8080/search?q=<query>"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_IMAGE_GENERATION: "true"
      IMAGE_GENERATION_MODEL: ${IMAGE_GEN_MODEL}
      IMAGES_OPENAI_API_BASE_URL: "https://openrouter.ai/api/v1"
      IMAGES_OPENAI_API_KEY: ${OPENROUTER_API_KEY}
      ENABLE_PERSISTENT_CONFIG: ${WEBUI_PERSIST_CONFIG}
    network_mode: service:tailscale
    depends_on:
      - tailscale

  # Tailscale is used for networking (highly recommend learning it--it's an awesome tool)
  tailscale:
    image: tailscale/tailscale:latest
    hostname: dinc
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: "/var/lib/tailscale"
      TS_SERVE_CONFIG: "/config/serve.json"
    volumes:
      - ./tailscale/state:/var/lib/tailscale
      - ./tailscale/config:/config
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    restart: unless-stopped
    networks: 
      - ai-stack

  # Searxng is used for web search. It is a search engine. 
  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_HOST: "[::]"
      SEARXNG_PORT: 8080
    volumes:
      - ./searxng/config:/etc/searxng/:rw
      - ./searxng/data:/var/cache/searxng/
    networks:
      - ai-stack

  # Valkey is the caching system for searxng. 
  valkey:
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: always
    volumes:
      - ./valkey/data:/data/
    networks:
      - ai-stack

  # MCPO exposes all the custom tools for the model. If you want to add more tools,
  # all you need to do is add the command to the mcpo config file. One caveat is 
  # that the mcp server does need to be able to be run with either uvx or npx
  # because that is that what is available within the mcpo image. 
  mcpo:
    image: ghcr.io/open-webui/mcpo:main
    working_dir: /workspace
    volumes:
      - ./mcpo/config:/config
      - ./mcpo/workspace:/workspace
    command:
      - --config
      - /config/mcp_servers.json
      - --port
      - "8000"
      - --api-key
      - ${MCPO_API_KEY}
      - --hot-reload
    restart: unless-stopped
    networks:
      - ai-stack

networks:
  ai-stack:
